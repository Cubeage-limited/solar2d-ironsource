name: JVM Tests

on:
  merge_group:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  jvm-tests:
    runs-on: sylphx-linux-standard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Self-contained: compiles android/src/main/java/plugin/ironSource/LuaLoader.java
      # against tests/jvm/stubs and runs the dispatch regression suite. No Android SDK,
      # no Gradle, no network.
      - name: Run JVM regression tests
        run: bash tests/jvm/run.sh

  # The required gate accepts only successful selected jobs.
  ci-ok:
    if: ${{ always() }}
    needs: [jvm-tests]
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED: jvm-tests
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          required = {job.strip() for job in os.environ["REQUIRED"].split(",") if job.strip()}
          if not isinstance(needs, dict) or not needs or not required:
              sys.exit("ci-ok: needs and required jobs must be nonempty")
          failed = {job: "absent" for job in required - needs.keys()}
          for job, value in sorted(needs.items()):
              result = value.get("result") if isinstance(value, dict) else None
              print(f"{job}: {result}")
              if result not in ("success", "skipped") or (job in required and result != "success"):
                  failed[job] = result or "absent"
          if failed:
              sys.exit(f"ci-ok: required jobs did not succeed: {failed}")
          PY
